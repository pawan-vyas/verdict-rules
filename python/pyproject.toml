# Workspace root for this repository's Python packages.
#
# Deliberately not a package itself — it has no [project] table, so it declares
# a workspace without being a member of one. `verdict-rules` lives under
# packages/ like any other distribution would, so adding a second is a new
# directory and nothing existing moves.
#
# That matters more than it looks: the package root and the language directory
# used to be the same path, which reads unambiguously only while there is
# exactly one distribution. See docs/maintenance.md.
#
# This root exists now rather than later because examples/ lives outside any
# package and still has to import one. `uv run pytest` here resolves the
# workspace and collects both.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
verdict-rules = { workspace = true }

[dependency-groups]
dev = [
    "anyio>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "verdict-rules",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
