# Releases the AI-agent skill when its version changes on main.
#
# The skill versions independently of every language SDK — it measures the
# guidance under skills/verdict/, not any library's API. See docs/maintenance.md.
#
# Same shape as release-python.yml: a version bump on main is the trigger, and
# the release job only runs once everything before it has passed. There is no
# test suite for the skill itself, so the gate here is check-skill-version.yml
# having already required the bump that got us here.
name: Release (Skill)

on:
  push:
    branches: [main]
    paths:
      - "skills/verdict/**"
      - ".claude-plugin/**"
      - ".github/workflows/release-skill.yml"
  workflow_dispatch:

concurrency:
  group: release-skill
  cancel-in-progress: false

jobs:
  detect:
    name: Is there a new skill version to release?
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare plugin.json's version against existing tags
        id: check
        run: |
          set -euo pipefail
          version="$(jq -er '.version' .claude-plugin/plugin.json)"
          tag="skill-v${version}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Version ${version} is already released as ${tag}. Nothing to do."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${version} has no ${tag} tag yet — releasing."
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  verify:
    name: The skill builds into all three artifacts
    needs: detect
    if: needs.detect.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and check every expected artifact exists
        run: |
          set -euo pipefail
          chmod +x scripts/build.sh
          ./scripts/build.sh
          for f in verdict-plugin.zip verdict.skill verdict-tools.zip; do
            [ -s "dist/$f" ] || { echo "::error::build.sh did not produce dist/$f"; exit 1; }
          done
          # get.sh resolves the latest release and pulls this one, so a release
          # missing it breaks the curl-pipe installer outright.
          unzip -l dist/verdict-tools.zip | grep -q 'skill/SKILL.md' \
            || { echo "::error::verdict-tools.zip has no skill payload"; exit 1; }

  release:
    name: Tag and publish the GitHub release
    needs: [detect, verify]
    permissions:
      contents: write
    uses: ./.github/workflows/release-github.yml
    with:
      tag: ${{ needs.detect.outputs.tag }}
      title: Skill v${{ needs.detect.outputs.version }}
