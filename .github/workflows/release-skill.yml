# Triggered by a skill-vX.Y.Z tag push. Ships the AI-agent skill on its own cadence, independently
# of any language SDK — see docs/maintenance.md's "The skill's version is a separate number".
#
# Why this exists at all: scripts/get.sh (the curl-pipe install path) resolves whatever GitHub calls
# the *latest* release and pulls verdict-tools.zip from it. Without this workflow the only thing
# cutting a release is release-python.yml, so a skill-only change would sit unreleased until the
# next Python version shipped — leaving get.sh users on a stale skill for a change that has nothing
# to do with the library. Marketplace and clone users already track main directly and were never
# affected; this closes the gap for the one path that isn't.
#
# Every release in this repo — this one and release-python.yml — attaches the full set of skill
# artifacts, so "latest" always carries a usable verdict-tools.zip no matter which kind of release
# happened to come last.
name: Release (Skill)

on:
  push:
    tags:
      - "skill-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MANIFEST: .claude-plugin/plugin.json
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "version=${tag#skill-v}" >> "$GITHUB_OUTPUT"

      - name: Verify plugin.json version matches the tag
        run: |
          set -euo pipefail
          declared="$(jq -er '.version' "$MANIFEST")"
          if [ "$declared" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error file=$MANIFEST::Tag ${GITHUB_REF_NAME} declares version ${{ steps.version.outputs.version }}, but $MANIFEST says $declared. Fix the mismatch and re-tag before releasing."
            exit 1
          fi

      - name: Build skill-distribution artifacts
        run: |
          set -euo pipefail
          chmod +x scripts/build.sh
          ./scripts/build.sh

      # Same as release-python.yml: the body is the hand-written CHANGELOG
      # section for this tag, not an auto-generated commit list.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          notes="$(awk -v hdr="## skill-v$version" '
            index($0, hdr) == 1 { found = 1; next }
            /^## / { if (found) exit }
            found { print }
          ' CHANGELOG.md)"

          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error file=CHANGELOG.md::No '## skill-v$version' section found. Add the changelog entry in the same commit as the version bump, then re-tag."
            exit 1
          fi

          # Written to a file, never to a step output. A step output gets
          # interpolated into a later step's shell, where the changelog's
          # backticks become command substitution and every code span is
          # silently eaten. --notes-file passes the bytes through untouched.
          {
            printf '%s\n' "$notes"
            echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md"
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Whatever build.sh produced, rather than a hardcoded list that can drift from it.
          gh release create "${GITHUB_REF_NAME}" \
            --title "Skill v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            dist/*
