# Runs on EVERY pull request, deliberately — see test-python.yml for why the
# path filter lives inside the workflow rather than on its trigger, and why the
# gate job is what branch protection marks required.
name: Test (Dart)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    name: Did anything Dart change?
    runs-on: ubuntu-latest
    outputs:
      dart: ${{ steps.filter.outputs.dart }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the base commit must be present to diff against

      - name: Decide whether the suite needs to run
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # A branch creation, a force-push or a manual dispatch leaves no
          # usable base commit. Having nothing to compare against must mean
          # "run the tests", never "skip them" — the failure has to be safe.
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable base commit — running the suite rather than assuming it is unnecessary."
            echo "dart=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BASE_SHA" HEAD -- 'dart' '.github/workflows/test-dart.yml')"
          if [ -n "$changed" ]; then
            echo "Dart files changed:"
            echo "$changed" | sed 's/^/  /'
            echo "dart=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Dart files changed in ${BASE_SHA}..HEAD."
            echo "dart=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: dart test
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart/packages/verdict_rules
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe (last published version, below) needs tag history

      - uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      # Must report zero issues, not just "doesn't crash" — analysis_options.yaml
      # enables lints beyond the defaults, and a lint regression is exactly the
      # kind of thing a green test suite alone would miss.
      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: dart test

      # dart_apitool is a dev-only tool used exclusively from CI (and by hand
      # when regenerating api-snapshot.json) -- not a pubspec.yaml
      # dev_dependency. Its own README documents global activation as the
      # install method, and the package pulls in a full `analyzer` toolchain
      # this package's own `dart pub get`/`dart test` has no reason to carry
      # for every contributor and every consumer resolving this package's
      # dependency tree. Pinned, not left to float, so a dart_apitool release
      # can't silently change what either check below reports.
      - name: Install dart_apitool
        run: |
          dart pub global activate dart_apitool 0.23.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # Fails if dart/packages/verdict_rules/api-snapshot.json (the committed
      # Dart snapshot scripts/api_snapshot_dart.py parses for the
      # cross-language concept map) no longer matches what `dart-apitool
      # extract` sees in the live source -- a declared public symbol that
      # disappeared, or a new one nobody acknowledged. See
      # docs/maintenance/api-snapshots.md and
      # scripts/check_api_snapshot_dart.py's own module docstring for why
      # this can't be `dart-apitool diff` directly (its --old/--new only
      # accept a package ref, never a bare JSON file).
      - name: Check committed API snapshot is current
        run: python3 ../../../scripts/check_api_snapshot_dart.py

      - name: Find the last published Dart version
        id: last-published
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0 --match 'dart-v*' 2>/dev/null || true)"
          if [ -z "$tag" ]; then
            echo "No dart-v* tag found yet -- nothing published to diff against."
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "Last published tag: $tag"
            echo "version=${tag#dart-v}" >> "$GITHUB_OUTPUT"
          fi

      # dart_apitool's OWN documented CI convention (its README's
      # "Integration" section) is diffing the live package against the last
      # *published* pub.dev version via a git tag, not against a committed
      # file -- `dart-apitool diff` has no file-based mode at all, only
      # package refs (directory/pub/git). This is a different, complementary
      # check from the one above: it catches a public-surface change that
      # shipped without the version bump semver requires, which a stale-
      # snapshot check alone would not. Caveat worth knowing before trusting
      # this check's silence: dart_apitool's own element collector drops
      # every @override member from its model (confirmed against this
      # package's issue #98 toString() additions -- see
      # scripts/api_snapshot_dart.py's module docstring), so it cannot
      # detect a toString()-only change either.
      - name: Check public API against the last published version
        if: steps.last-published.outputs.version != ''
        run: dart-apitool diff --old "pub://verdict_rules/${{ steps.last-published.outputs.version }}" --new .

  # THE JOB TO MARK REQUIRED IN BRANCH PROTECTION. See test-python.yml for why
  # it must distinguish success/skipped from failure/cancelled, and why an
  # empty result set fails rather than passing vacuously.
  gate:
    name: Dart tests passed or were not needed
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every upstream job must have succeeded or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Upstream results: $RESULTS"

          if [ -z "$(printf '%s' "$RESULTS" | tr -d '[:space:]')" ]; then
            echo "::error::No upstream job results were reported. Refusing to pass a gate that learned nothing."
            exit 1
          fi

          failed=0
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::An upstream job finished as '$result'."; failed=1 ;;
            esac
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "Gate satisfied."
