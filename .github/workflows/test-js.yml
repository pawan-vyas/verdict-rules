# Runs on EVERY pull request, deliberately — see test-python.yml for why the
# path filter lives inside the workflow rather than on its trigger, and why the
# gate job is what branch protection marks required.
name: Test (JS/TS)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    name: Did anything JS/TS change?
    runs-on: ubuntu-latest
    outputs:
      js: ${{ steps.filter.outputs.js }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the base commit must be present to diff against

      - name: Decide whether the suite needs to run
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # A branch creation, a force-push or a manual dispatch leaves no
          # usable base commit. Having nothing to compare against must mean
          # "run the tests", never "skip them" — the failure has to be safe.
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable base commit — running the suite rather than assuming it is unnecessary."
            echo "js=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BASE_SHA" HEAD -- 'js' '.github/workflows/test-js.yml')"
          if [ -n "$changed" ]; then
            echo "JS/TS files changed:"
            echo "$changed" | sed 's/^/  /'
            echo "js=true" >> "$GITHUB_OUTPUT"
          else
            echo "No JS/TS files changed in ${BASE_SHA}..HEAD."
            echo "js=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: npm test
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node floor is 18 (see js/packages/verdict-rules/package.json)
        # — the matrix covers that floor through the newest LTS/current, not
        # just whatever the dev machine happens to run.
        node-version: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@v7

      - name: Install Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: js
        run: npm ci

      - name: Typecheck
        working-directory: js
        run: npm run typecheck

      - name: Build
        working-directory: js
        run: npm run build

      - name: Run tests
        working-directory: js
        run: npm test

  # THE JOB TO MARK REQUIRED IN BRANCH PROTECTION. See test-python.yml for why
  # it must distinguish success/skipped from failure/cancelled, and why an
  # empty result set fails rather than passing vacuously.
  gate:
    name: JS/TS tests passed or were not needed
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every upstream job must have succeeded or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Upstream results: $RESULTS"

          if [ -z "$(printf '%s' "$RESULTS" | tr -d '[:space:]')" ]; then
            echo "::error::No upstream job results were reported. Refusing to pass a gate that learned nothing."
            exit 1
          fi

          failed=0
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::An upstream job finished as '$result'."; failed=1 ;;
            esac
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "Gate satisfied."
