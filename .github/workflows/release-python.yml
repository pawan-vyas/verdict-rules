# Releases Python when its version changes on main — nothing is tagged or
# published by hand.
#
# The old design triggered on a python-v* tag push, which meant two manual
# steps (tag, push) and, worse, no guarantee the tag pointed at a commit whose
# tests had passed. Publishing is irreversible on every registry we target, so
# a release that has not been tested is a version number burned.
#
# Now: bump python/pyproject.toml, add the changelog entry, merge. This detects
# the new version, runs the full matrix, publishes, and only then tags. Each
# job needs the one before it, so nothing reaches PyPI unless every supported
# Python version passed first.
name: Release (Python)

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/release-python.yml"
  workflow_dispatch: # escape hatch: re-run a release that failed after tagging

concurrency:
  group: release-python
  cancel-in-progress: false # never interrupt a publish

jobs:
  detect:
    name: Is there a new version to release?
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare the manifest version against existing tags
        id: check
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' python/pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          tag="python-v${version}"

          if [ -z "$version" ]; then
            echo "::error file=python/pyproject.toml::Could not read a version."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Version ${version} is already released as ${tag}. Nothing to do."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${version} has no ${tag} tag yet — releasing."
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Validated here, before anything is published, rather than where the
      # notes are used. The release tail runs after the registry upload, so a
      # missing section discovered there would mean a live version with no tag
      # and no release — and neither PyPI nor npm lets you take one back.
      - name: The changelog section exists before anything is published
        if: steps.check.outputs.should-release == 'true'
        run: python3 scripts/changelog_section.py python/CHANGELOG.md "${{ steps.check.outputs.version }}" > /dev/null

  test:
    name: Full suite before anything is published
    needs: detect
    if: needs.detect.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true # one failure should stop the release, not survey the rest
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - name: Run tests
        working-directory: python
        run: |
          uv sync --python ${{ matrix.python-version }}
          uv run --python ${{ matrix.python-version }} pytest --cov=verdict --cov-report=term-missing

  build:
    name: Build sdist and wheel
    needs: [detect, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Build
        working-directory: python
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/

  # This job must stay in THIS file. PyPI Trusted Publishing does not work
  # with GitHub Actions reusable workflows at all — not a filename mismatch you
  # could register around, a documented limitation with an open upstream issue.
  # Moving the publish into release-github.yml would break authentication with
  # an error that gives no hint why.
  #
  # It costs nothing: publishing is the one part of a release that is genuinely
  # per-language. PyPI publishes over OIDC directly, npm cannot bootstrap a
  # first publish at all, NuGet exchanges a token for a one-hour key, and
  # pub.dev drives its own reusable workflow off a tag pattern. There is no
  # shared step here to factor out — only the tail after it, which is what
  # release-github.yml holds.
  publish-pypi:
    name: Publish to PyPI
    needs: [detect, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC) — no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  release:
    name: Tag and publish the GitHub release
    needs: [detect, publish-pypi]
    permissions:
      contents: write
    uses: ./.github/workflows/release-github.yml
    with:
      tag: ${{ needs.detect.outputs.tag }}
      version: ${{ needs.detect.outputs.version }}
      changelog-path: python/CHANGELOG.md
      title: Python v${{ needs.detect.outputs.version }}
      artifact-name: python-dist

  # Confirms what PyPI is actually serving, rather than trusting that the upload
  # step exiting zero means the right thing is there.
  #
  # This lives here rather than in release-github.yml because the mechanism is
  # per-registry even though the question is not: PyPI exposes PEP 740
  # attestations at an integrity endpoint, npm reports dist.attestations, NuGet
  # embeds a .signature.p7s, and pub.dev offers nothing comparable. Same reason
  # the publish step is not shared.
  verify-published:
    name: Verify what PyPI is serving
    needs: [detect, release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
      - name: The version is live and resolvable
        run: |
          set -euo pipefail
          url="https://pypi.org/pypi/verdict-rules/${VERSION}/json"

          # Deliberately the version-specific endpoint, not /pypi/<pkg>/json.
          # That summary is CDN-cached and lagged by minutes during the 0.2.0
          # release, reporting the previous version while this one was already
          # installable. Asserting against it would fail good releases.
          code=000
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -s -o version.json -w '%{http_code}' "$url")"
            [ "$code" = "200" ] && break
            echo "Attempt ${attempt}: HTTP ${code} — waiting for propagation"
            sleep 20
          done

          if [ "$code" != "200" ]; then
            echo "::error::PyPI is not serving ${VERSION} after ~2 minutes. The publish step reported success, so check the project page before assuming a false alarm."
            exit 1
          fi
          echo "Serving $(jq -r '.info.version' version.json) with $(jq '.urls | length' version.json) file(s)"

      - name: Every published file carries a PEP 740 attestation
        run: |
          set -euo pipefail

          # Provenance is the one property that can disappear without any
          # symptom. It exists because we publish over OIDC; a workflow rewritten
          # to use a stored API token would upload successfully, pass every other
          # check, and simply carry no attestation. Nothing else would notice,
          # which is exactly why this is asserted rather than assumed.
          failed=0
          for file in $(jq -r '.urls[].filename' version.json); do
            bundles="$(curl -s "https://pypi.org/integrity/verdict-rules/${VERSION}/${file}/provenance" \
              | jq '(.attestation_bundles // []) | length' 2>/dev/null || echo 0)"
            if [ "${bundles:-0}" -gt 0 ]; then
              echo "OK ${file}: ${bundles} attestation bundle(s)"
            else
              echo "::error::${file} has no PEP 740 attestation. Publishing is no longer producing provenance — check that publish-pypi still runs under Trusted Publishing with id-token: write rather than a stored token."
              failed=1
            fi
          done

          [ "$failed" -eq 0 ] || exit 1
