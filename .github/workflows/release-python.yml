# Triggered by a python-vX.Y.Z tag push (the language-scoped tagging regimen — see
# docs/maintenance.md's "How this package is released and consumed" and CHANGELOG.md's intro).
# Named to leave room for release-js.yml/release-csharp.yml siblings once those languages ship,
# each triggered by its own tag prefix.
#
# Registered on PyPI as a Trusted Publisher for this exact repo/workflow-filename/environment
# combination — see the "pypi" environment below. No API token is stored as a secret anywhere;
# PyPI verifies the OIDC token GitHub issues to the publish-pypi job instead.
name: Release (Python)

on:
  push:
    tags:
      - "python-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Extract version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#python-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify pyproject.toml version matches the tag
        working-directory: python
        run: |
          declared="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$declared" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} declares version ${{ steps.version.outputs.version }}, but pyproject.toml says $declared. Fix the mismatch and re-tag before releasing."
            exit 1
          fi

      - name: Build sdist and wheel
        working-directory: python
        run: uv build

      - name: Upload Python build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC) — no API token needed
    steps:
      - name: Download Python build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      # Every release in this repo attaches the full set of skill artifacts, so scripts/get.sh —
      # which pulls verdict-tools.zip from whatever GitHub calls the latest release — always finds
      # one, whether the last release was a Python one or a skill one (see release-skill.yml).
      - name: Build skill-distribution artifacts
        run: |
          set -euo pipefail
          chmod +x scripts/build.sh
          ./scripts/build.sh
          mkdir -p release-assets
          # Whatever build.sh produced, rather than a hardcoded list that can drift from it.
          cp dist/* release-assets/

      - name: Download Python build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release-assets/

      # The release body is this language's own CHANGELOG section, not GitHub's
      # auto-generated commit list. The changelog is written by hand, in the same
      # commit as the version bump, and says what changed and why — which is what
      # someone opening the release page actually wants. --generate-notes produced
      # a bare "Full Changelog" link.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          notes="$(awk -v hdr="## python-v$version" '
            index($0, hdr) == 1 { found = 1; next }
            /^## / { if (found) exit }
            found { print }
          ' CHANGELOG.md)"

          # A missing section means the changelog entry was not written alongside
          # the version bump, which docs/maintenance.md requires. Fail rather than
          # publish a release with no notes.
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error file=CHANGELOG.md::No '## python-v$version' section found. Add the changelog entry in the same commit as the version bump, then re-tag."
            exit 1
          fi

          # Written to a file, never to a step output. A step output gets
          # interpolated into a later step's shell, where the changelog's
          # backticks become command substitution and every code span is
          # silently eaten. --notes-file passes the bytes through untouched.
          {
            printf '%s\n' "$notes"
            echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md"
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "Python v${{ needs.build.outputs.version }}" \
            --notes-file release-notes.md \
            release-assets/*
