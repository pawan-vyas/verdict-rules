# Lints every markdown file in the repo with markdownlint-cli2, using the
# rules and exclusions committed at .markdownlint.jsonc (auto-discovered by
# cli2's own cascading config lookup) and .markdownlint-cli2.jsonc -- nothing
# is configured here that isn't also visible to someone running the same
# command locally.
#
# Runs on EVERY pull request, with no trigger-level path filter, so it can be
# marked required in branch protection. A path-filtered workflow never starts
# on an unrelated PR, so no check run is ever created and protection waits
# forever -- the same reasoning check-skill-version.yml documents.
#
# Language-agnostic, because docs/ is: this check has nothing to do with any
# one SDK, so it sits alongside test-python.yml rather than inside it.
name: Lint docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run markdownlint
        run: npx --yes markdownlint-cli2@0.18.1

      - name: Validate mermaid diagrams
        # The validator takes one markdown file per invocation, so walk every
        # tracked doc that carries a mermaid block. Vendored skills are
        # excluded for the same reason markdownlint excludes them: they are
        # tool-owned, never authored here. Every file is attempted so one
        # failure does not hide the others.
        run: |
          status=0
          for doc in $(git ls-files '*.md' ':!:.agents/skills' ':!:.claude/skills' | xargs grep -l '^```mermaid'); do
            node .agents/skills/mermaid-diagrams/scripts/validate_diagrams.js --markdown "$doc" || { echo "::error file=$doc::mermaid validation failed"; status=1; }
          done
          exit "$status"
