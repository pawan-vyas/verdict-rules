# The part of a release that is identical for every language, factored out so
# adding a language is a thin caller rather than another full copy of this.
#
# Everything language-specific — building, testing, publishing to a registry —
# stays in the caller, because it genuinely differs. What is common is the tail:
# the tag, the changelog section, the skill artifacts, and the GitHub release.
#
# Called by release-<lang>.yml. Not triggerable on its own.
name: Release (GitHub)

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to create and release, e.g. python-v0.1.2'
        required: true
        type: string
      title:
        description: 'Release title, e.g. "Python v0.1.2"'
        required: true
        type: string
      artifact-name:
        description: 'Name of an uploaded artifact to attach alongside the skill zips. Empty to attach only the skill zips.'
        required: false
        default: ''
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tag and the release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, so an existing one can be detected

      - name: Refuse to release a tag that already exists
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${{ inputs.tag }}" >/dev/null; then
            echo "::error::Tag ${{ inputs.tag }} already exists. A release is being attempted for a version that has already shipped."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          notes="$(awk -v hdr="## ${{ inputs.tag }}" '
            index($0, hdr) == 1 { found = 1; next }
            /^## / { if (found) exit }
            found { print }
          ' CHANGELOG.md)"

          # A missing section means the changelog entry was not written
          # alongside the version bump, which docs/maintenance.md requires.
          # Fail rather than publish a release with no notes.
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error file=CHANGELOG.md::No '## ${{ inputs.tag }}' section found. Add the changelog entry in the same commit as the version bump."
            exit 1
          fi

          # Written to a file, never to a step output. A step output is
          # interpolated into a later step's shell, where the changelog's
          # backticks become command substitution and every code span is
          # silently eaten. See .agents/incidents/001.
          {
            printf '%s\n' "$notes"
            echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/blob/${{ inputs.tag }}/CHANGELOG.md"
          } > release-notes.md

      - name: Build skill-distribution artifacts
        run: |
          set -euo pipefail
          chmod +x scripts/build.sh
          ./scripts/build.sh
          mkdir -p release-assets
          # Whatever build.sh produced, rather than a list that can drift from it.
          cp dist/* release-assets/

      - name: Download the language's own build artifacts
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: release-assets/

      - name: Create the tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.tag }}" -m "${{ inputs.title }}"
          git push origin "${{ inputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ inputs.tag }}" \
            --title "${{ inputs.title }}" \
            --notes-file release-notes.md \
            release-assets/*

      # Everything below verifies what was just published rather than trusting
      # that publishing succeeded. Only the deterministic checks live here — a
      # registry needs time to serve a new version, so "is it installable" and
      # "does it carry provenance" are a documented post-flight step in
      # docs/maintenance.md instead of a flaky job.
      - name: Verify the release notes survived the shell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published="$(gh release view "${{ inputs.tag }}" --json body -q .body)"

          # Regression guard for .agents/incidents/001: notes were once passed
          # through a step output, so bash read the changelog's backticks as
          # command substitution and every code span published empty. The
          # release succeeded and simply read as though words were missing.
          expected="$(grep -c '`' release-notes.md || true)"
          actual="$(printf '%s' "$published" | grep -c '`' || true)"
          echo "Backticks — source: $expected, published: $actual"
          if [ "$expected" -gt 0 ] && [ "$actual" -eq 0 ]; then
            echo "::error::Release notes published with every code span stripped. See .agents/incidents/001."
            exit 1
          fi
          if [ -z "$(printf '%s' "$published" | tr -d '[:space:]')" ]; then
            echo "::error::Release notes published empty."
            exit 1
          fi

      - name: Verify every expected asset is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          attached="$(gh release view "${{ inputs.tag }}" --json assets -q '.assets[].name' | sort)"
          echo "Attached:"; echo "$attached" | sed 's/^/  /'
          for expected in verdict-plugin.zip verdict-tools.zip verdict.skill; do
            echo "$attached" | grep -qx "$expected" || {
              echo "::error::$expected is missing from the release."; exit 1; }
          done

      - name: Verify scripts/get.sh can still resolve the skill
        run: |
          set -euo pipefail
          # get.sh pulls verdict-tools.zip from whatever GitHub calls the latest
          # release. If a release of either kind omits it, the curl-pipe
          # installer breaks outright — so this is checked after every one.
          url="$(curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
            | grep '"browser_download_url"' \
            | grep 'verdict-tools\.zip' \
            | sed -E 's/.*"browser_download_url": *"([^"]+)".*/\1/' \
            | head -n1)"
          if [ -z "$url" ]; then
            echo "::error::The latest release has no verdict-tools.zip — scripts/get.sh is broken."
            exit 1
          fi
          echo "get.sh would resolve: $url"
          curl -fsSL "$url" -o /tmp/vt.zip
          unzip -l /tmp/vt.zip | grep -q 'skill/SKILL.md' || {
            echo "::error::verdict-tools.zip carries no skill payload."; exit 1; }
          echo "Payload verified."

