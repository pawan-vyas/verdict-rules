# See pubspec.lock's own comment -- same reasoning, for the Flutter fixture.
# Real filename is pubspec.lock when this is handed to an agent, alongside
# pubspec_flutter.yaml as pubspec.yaml. Only the entries relevant to
# establishing the resolved verdict_rules version are included; a real
# Flutter app's lockfile also pins the Flutter SDK's own internal packages
# (sky_engine, and so on), omitted here as noise the eval doesn't need.
packages:
  flutter:
    dependency: "direct main"
    description: flutter
    source: sdk
    version: "0.0.0"
  verdict_rules:
    dependency: "direct main"
    description:
      name: verdict_rules
      sha256: "1f9d6a9d6c8f9e9e4a3f4b1e6c2a9d8b7c6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a"
      url: "https://pub.dev"
    source: hosted
    version: "0.0.2"
sdks:
  dart: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"
