# A minimal, deliberately ordinary project manifest.
#
# It exists so an eval run has something to answer the skill's first step with
# — "read the target project's own manifest to determine the language" is not
# testable in an empty directory, and an agent that has to guess the language
# is not being asked the question the skill actually poses.
#
# The pinned verdict-rules version is load-bearing too: the skill says to fetch
# deeper documentation at the version a project actually has, never from the
# default branch, and that instruction is unexercisable without a version here.
#
# Keep this at a version that is ACTUALLY published and ACTUALLY tagged
# (python-vX.Y.Z) — check both PyPI and the git tag before bumping it. A
# changelog entry for a version that never went through the real release
# workflow is not evidence it exists; pinning one here silently breaks the
# fetch-at-the-installed-version instruction this fixture exists to test.
#
# Prefer the LATEST published tag over an older one. Every eval that fetches
# specific doc paths (python/05-fetch-docs-completeness, for instance) fetches
# them from this pinned tag's own snapshot of docs/, not from main — a version
# pinned to a tag that predates a doc restructuring (docs/extension.md ->
# docs/extending/, in 0.2.2) will legitimately 404 on paths that exist today,
# for a reason that has nothing to do with whether the skill itself is right.
[project]
name = "storefront-api"
version = "1.4.0"
requires-python = ">=3.10"
dependencies = [
    "verdict-rules==0.2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
