# Which repository documents this skill carries. Hand-authored, not
# glob-discovered: each line is a deliberate decision.
#
# Shapes:
#   [topics]        category -> [names] -> readme = docs/<category>/<name>/README.md,
#                   pattern = docs/<category>/<name>/{lang}.md
#   docs            source with destination == source
#   [quickstarts]   language -> source; destination = "<lang>/quickstart.md"
#   [[bundled]]     copied into the artifact by scripts/build.sh
#   [[fetch]]       explicit source + destination (rare one-off)
#   [[fetch_group]] explicit readme + {lang}-templated pattern
#
# `docs` must appear before any [[...]] header (TOML folds a bare
# key=value into whichever array-of-tables is currently open).

languages = ["python", "js", "dart", "csharp"]

docs = [
  "docs/extending/README.md",
  "docs/samples/README.md",
]

[topics]
extending = [
  "wrapping-a-predicate",
  "new-rule-shape",
  "domain-adapter-module",
  "data-driven-rule-construction",
  "nesting-composites",
  "absence-vs-failure",
  "isolating-flaky-predicates",
  "reusing-a-rule-across-contexts",
]
samples = [
  "dynamic-discounts",
  "shipping-fee-waiver",
  "loyalty-tier-promotion",
  "content-moderation-routing",
  "data-driven-rule-sets",
  "admin-eligibility-lookup",
  "signup-form-readiness",
  "premium-upsell-panel",
  "graduation-requirement-verdict",
  "marketplace-eligibility",
]

[[bundled]]
source = "docs/architecture/"
destination = "docs/architecture/"

[[fetch_group]]
readme = "docs/testing/README.md"
pattern = "docs/testing/{lang}.md"

[quickstarts]
python = "python/packages/verdict-rules/docs/quickstart.md"
js = "js/packages/verdict-rules/docs/quickstart.md"
dart = "dart/packages/verdict_rules/doc/quickstart.md"
csharp = "csharp/src/VerdictRules/docs/quickstart.md"

[[fetch]]
source = "python/examples/graduation_verdict/README.md"
destination = "python/example/README.md"

[[fetch]]
source = "python/examples/graduation_verdict/docs/testing.md"
destination = "python/example/testing.md"
