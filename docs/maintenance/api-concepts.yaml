# The diagnostics concepts. Each tool's own visibility into this differs,
# so the member field lists only what that tool can and does verify, not
# everything the language actually ships. Full story in each language's
# own row below. None of this changes that every language genuinely has
# the behaviour -- each one's diagnostics tests cover it -- only what this
# particular mechanism can mechanically re-confirm on every future
# change.
#
# - C#: PublicApiAnalyzers only ever sees ToString -- DebuggerDisplay is a
#   private property and DebuggerTypeProxy names an internal nested type,
#   neither is public API surface to begin with.
# - Python: griffe sees __repr__ directly, no gap.
# - JS/TS: api-extractor only ever sees toString -- a computed class member
#   keyed by Symbol.for(...) (not a `unique symbol`) cannot be expressed in
#   emitted .d.ts output, so inspect.custom is structurally invisible to
#   any .d.ts-based tool, not just this one.
# - Dart: dart_apitool's own element collector drops every @override member
#   outright (treated as "already part of the source"), so toString() is
#   invisible in its entirety -- confirmed empirically: diffing 0.3.1
#   against 0.4.0 reports "No changes detected!" despite toString() being
#   this version's whole changelog entry. type: "" here means "not
#   tracked for Dart," the same convention RulePredicate's python/js rows
#   already use for "this language has no such type" -- except here the
#   type and the behavior both genuinely exist, only this one tool cannot
#   see it, which is exactly why it is left empty rather than asserted
#   and permanently unresolvable.
- concept: FunctionRule has a readable string/debugger representation
  type: { csharp: FunctionRule, python: FunctionRule, js: FunctionRule, dart: "" }
  member: { csharp: ToString, python: __repr__, js: toString, dart: "" }

- concept: AndRule has a readable string/debugger representation
  type: { csharp: AndRule, python: AndRule, js: AndRule, dart: "" }
  member: { csharp: ToString, python: __repr__, js: toString, dart: "" }

- concept: OrRule has a readable string/debugger representation
  type: { csharp: OrRule, python: OrRule, js: OrRule, dart: "" }
  member: { csharp: ToString, python: __repr__, js: toString, dart: "" }

- concept: RulesEngine has a readable string/debugger representation
  type: { csharp: RulesEngine, python: RulesEngine, js: RulesEngine, dart: "" }
  member: { csharp: ToString, python: __repr__, js: toString, dart: "" }

