- concept: RuleResult.subResults (a composite's own children, exactly what it evaluated)
  type: { csharp: RuleResult, python: RuleResult, js: RuleResult, dart: RuleResult }
  member: { csharp: SubResults, python: sub_results, js: subResults, dart: subResults }

# C# spells this as a method for the same reason it spells leaves/failingLeaves
# as methods (see the note below those rows): a get-only collection property
# returning the child results would be serialized, which reintroduces exactly
# the duplication storing positions exists to prevent. The other three keep an
# accessor, because their ecosystems' serializers do not walk computed
# accessors.
- concept: RuleResult.decidedBy (which sub-results explain this result's own verdict)
  type: { csharp: RuleResult, python: RuleResult, js: RuleResult, dart: RuleResult }
  member: { csharp: GetDecidedBy, python: decided_by, js: decidedBy, dart: decidedBy }

# The positions those deciding children sit at within subResults, which is what
# is actually stored; decidedBy above is derived from it. Storing the child
# results themselves made the stored graph a DAG -- the same objects reachable
# under two fields -- and every tree-shaped encoder expands a shared node once
# per path, so serialized size doubled per nesting level. Positions keep the
# stored graph a genuine tree, and make an index naming a non-child the one
# detectable error, rejected at construction.
- concept: RuleResult.decidedByIndices (the stored positions decidedBy is derived from)
  type: { csharp: RuleResult, python: RuleResult, js: RuleResult, dart: RuleResult }
  member:
    { csharp: DecidedByIndices, python: decided_by_indices, js: decidedByIndices, dart: decidedByIndices }

# C# alone spells leaves/failingLeaves as methods rather than properties, on
# both result types. A get-only collection property that walks the subtree is
# traversed by every reflection-based serializer and structured logger, and a
# leaf's own leaves list is itself, so such a walker recurses until it gives
# up; [JsonIgnore] cannot suppress it (read-only collection properties are
# serialized even with IgnoreReadOnlyProperties, and the per-member attribute
# is not in-box for netstandard2.1). The Framework Design Guidelines point
# the same way -- the member is expensive and returns an array. The other
# three keep accessors because their ecosystems' serializers do not walk
# computed accessors at all.
- concept: RuleResult.leaves (every leaf reachable from this result)
  type: { csharp: RuleResult, python: RuleResult, js: RuleResult, dart: RuleResult }
  member: { csharp: GetLeaves, python: leaves, js: leaves, dart: leaves }

- concept: RuleResult.failingLeaves (the leaves explaining this result's failure)
  type: { csharp: RuleResult, python: RuleResult, js: RuleResult, dart: RuleResult }
  member: { csharp: GetFailingLeaves, python: failing_leaves, js: failingLeaves, dart: failingLeaves }

- concept: RunResult.leaves (every leaf across every rule the run evaluated)
  type: { csharp: RunResult, python: RunResult, js: RunResult, dart: RunResult }
  member: { csharp: GetLeaves, python: leaves, js: leaves, dart: leaves }

- concept: RunResult.failingLeaves
  type: { csharp: RunResult, python: RunResult, js: RunResult, dart: RunResult }
  member: { csharp: GetFailingLeaves, python: failing_leaves, js: failingLeaves, dart: failingLeaves }

