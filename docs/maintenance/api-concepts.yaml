# The cross-language concept map scripts/check_api_snapshots.py diffs every
# language's own public-API snapshot against. See
# docs/maintenance/api-snapshots.md for what this file is for and how to
# update it.
#
# Each entry is one concept that exists in every language this package
# ships for, with that concept's own spelling in each language's own idiom
# (PascalCase vs. camelCase vs. snake_case, an Async suffix where that
# language's convention calls for one, etc.). The check asserts every
# concept row resolves in all four snapshots, and that every symbol each
# snapshot actually exports is accounted for by either a concept row here
# or a language-specific entry in api-surface-allowlist.yaml. A concept
# silently missing in one language, or a new symbol nobody classified yet,
# both fail the gate.
#
# member: "" means the concept itself has no further members to track
# (a type-level concept, like a delegate/predicate type).

- concept: Rule (the structural contract every rule satisfies)
  type: { csharp: IRule, python: Rule, js: Rule, dart: Rule }
  member: ""

- concept: Rule.name
  type: { csharp: IRule, python: Rule, js: Rule, dart: Rule }
  member: { csharp: Name, python: name, js: name, dart: name }

- concept: Rule.group
  type: { csharp: IRule, python: Rule, js: Rule, dart: Rule }
  member: { csharp: Group, python: group, js: group, dart: group }

- concept: Rule.evaluate
  type: { csharp: IRule, python: Rule, js: Rule, dart: Rule }
  member: { csharp: EvaluateAsync, python: evaluate, js: evaluate, dart: evaluate }

- concept: RulePredicate (the function shape FunctionRule wraps)
  type: { csharp: RulePredicate, python: "", js: RulePredicate, dart: RulePredicate }
  member: ""

- concept: FunctionRule
  type: { csharp: FunctionRule, python: FunctionRule, js: FunctionRule, dart: FunctionRule }
  member: ""

- concept: AndRule
  type: { csharp: AndRule, python: AndRule, js: AndRule, dart: AndRule }
  member: ""

- concept: OrRule
  type: { csharp: OrRule, python: OrRule, js: OrRule, dart: OrRule }
  member: ""

