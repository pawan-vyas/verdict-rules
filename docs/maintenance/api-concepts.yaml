# C#'s own extracted symbol carries the constant's value (`VacuousResult =
# true`), because PublicApiAnalyzers records a const's value as part of the
# declared API -- changing the value is itself a breaking change there. The
# spelling below is the real extracted symbol, not a tidied one.
- concept: AndRule's vacuous-truth verdict, pinned as a readable constant
  type: { csharp: AndRule, python: AndRule, js: AndRule, dart: AndRule }
  member: { csharp: "VacuousResult = true", python: VACUOUS_RESULT, js: VACUOUS_RESULT, dart: vacuousResult }

- concept: OrRule's vacuous-truth verdict, pinned as a readable constant
  type: { csharp: OrRule, python: OrRule, js: OrRule, dart: OrRule }
  member: { csharp: "VacuousResult = false", python: VACUOUS_RESULT, js: VACUOUS_RESULT, dart: vacuousResult }
